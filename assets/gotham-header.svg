<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#11121c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Authentic Classic Batman Yellow Oval Emblem (Pure Vector) -->
  <g transform="translate(500, 48)" filter="url(#goldGlow)">
    <!-- Outer Yellow Oval Backplate -->
    <ellipse cx="0" cy="0" rx="60" ry="34" fill="#FFD700" stroke="#000000" stroke-width="2"/>
    <!-- Outer Black Border Ring -->
    <ellipse cx="0" cy="0" rx="56" ry="31" fill="none" stroke="#000000" stroke-width="2.5"/>
    <!-- Inner Fine Yellow Accent Ring -->
    <ellipse cx="0" cy="0" rx="53" ry="28" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.8"/>
    
    <!-- Iconic Classic Batman Bat Silhouette -->
    <path d="M 0 -12 
             C 2 -12 3 -17 5 -20 
             C 6 -20 7 -16 10 -14 
             C 22 -18 38 -12 48 -2 
             C 40 4 30 2 22 10 
             C 14 16 8 10 0 18 
             C -8 10 -14 16 -22 10 
             C -30 2 -40 4 -48 -2 
             C -38 -12 -22 -18 -10 -14 
             C -7 -16 -6 -20 -5 -20 
             C -3 -17 -2 -12 0 -12 Z" 
          fill="#000000"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="132" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="4" filter="url(#goldGlow)">
    PRASANNA BHURKE
  </text>

  <!-- Subtitle -->
  <text x="500" y="168" text-anchor="middle" fill="#fef08a" font-family="'Fira Code', 'Consolas', monospace" font-size="16" font-weight="600" letter-spacing="2" opacity="0.95">
    SENIOR SOFTWARE ENGINEER &#124; BATCAVE AI &amp; SYSTEMS ARCHITECT
  </text>

  <!-- Wavy Bottom Line -->
  <path d="M 0 210 Q 250 235 500 215 T 1000 220 L 1000 240 L 0 240 Z" fill="url(#waveGrad)" opacity="0.6"/>
  <path d="M 0 220 Q 250 195 500 225 T 1000 210 L 1000 240 L 0 240 Z" fill="url(#goldGrad)" opacity="0.25"/>
</svg>

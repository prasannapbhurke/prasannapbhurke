<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#11121c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Bat Signal Emblem Backplate -->
  <g transform="translate(500, 48) scale(0.65)" filter="url(#goldGlow)" opacity="0.85">
    <path d="M-60 0 C-60 -25 -25 -35 0 -15 C25 -35 60 -25 60 0 C60 25 35 35 0 35 C-35 35 -60 25 -60 0 Z" fill="none" stroke="#EAB308" stroke-width="2"/>
    <!-- Bat Symbol Silhouette -->
    <path d="M -40 -5 C -30 -15 -15 -10 0 -2 C 15 -10 30 -15 40 -5 C 35 5 25 2 18 12 C 12 20 6 22 0 15 C -6 22 -12 20 -18 12 C -25 2 -35 5 -40 -5 Z" fill="#FFD700"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="130" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="4" filter="url(#goldGlow)">
    PRASANNA BHURKE
  </text>

  <!-- Subtitle -->
  <text x="500" y="168" text-anchor="middle" fill="#fef08a" font-family="'Fira Code', 'Consolas', monospace" font-size="16" font-weight="600" letter-spacing="2" opacity="0.95">
    SENIOR SOFTWARE ENGINEER &#124; BATCAVE AI &amp; SYSTEMS ARCHITECT
  </text>

  <!-- Wavy Bottom Line -->
  <path d="M 0 210 Q 250 235 500 215 T 1000 220 L 1000 240 L 0 240 Z" fill="url(#waveGrad)" opacity="0.6"/>
  <path d="M 0 220 Q 250 195 500 225 T 1000 210 L 1000 240 L 0 240 Z" fill="url(#goldGrad)" opacity="0.25"/>
</svg>

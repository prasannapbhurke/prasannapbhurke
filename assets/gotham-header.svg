<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#11121c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Classic Bat-Signal Oval Emblem (Pure SVG Vectors) -->
  <g transform="translate(500, 48)" filter="url(#goldGlow)">
    <!-- Outer Oval Backplate -->
    <ellipse cx="0" cy="0" rx="56" ry="32" fill="#0d0e17" stroke="#EAB308" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="52" ry="28" fill="#141524" stroke="#FFD700" stroke-width="1" opacity="0.9"/>
    
    <!-- Classic Bat Silhouette (Vector Path) -->
    <path d="M -3 -18 
             Q 0 -13 3 -18 
             C 15 -22 36 -16 46 -6 
             C 38 4 28 0 20 10 
             C 14 18 8 16 0 24 
             C -8 16 -14 18 -20 10 
             C -28 0 -38 4 -46 -6 
             C -36 -16 -15 -22 -3 -18 Z" 
          fill="#FFD700" 
          stroke="#EAB308" 
          stroke-width="0.5"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="132" text-anchor="middle" fill="url(#goldGrad)" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="4" filter="url(#goldGlow)">
    PRASANNA BHURKE
  </text>

  <!-- Subtitle -->
  <text x="500" y="168" text-anchor="middle" fill="#fef08a" font-family="'Fira Code', 'Consolas', monospace" font-size="16" font-weight="600" letter-spacing="2" opacity="0.95">
    SENIOR SOFTWARE ENGINEER &#124; BATCAVE AI &amp; SYSTEMS ARCHITECT
  </text>

  <!-- Wavy Bottom Line -->
  <path d="M 0 210 Q 250 235 500 215 T 1000 220 L 1000 240 L 0 240 Z" fill="url(#waveGrad)" opacity="0.6"/>
  <path d="M 0 220 Q 250 195 500 225 T 1000 210 L 1000 240 L 0 240 Z" fill="url(#goldGrad)" opacity="0.25"/>
</svg>
